services:
  postgres:
    image: postgres:16-alpine
    container_name: meetnotes-postgres
    environment:
      POSTGRES_USER: meetnotes
      POSTGRES_PASSWORD: meetnotes
      POSTGRES_DB: meetnotes
    ports:
      - "5433:5432"
    volumes:
      - meetnotes-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetnotes -d meetnotes"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  meetnotes-pgdata:
